name: Install Region Talk bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-region-talk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: region-talk-bootstrap
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify bootstrap bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/parts/* | base64 --decode > /tmp/region-talk.bundle
          echo '4fec22802f70014f42f4daa5fc9dd26f79b73e019b6929469d9dc39c306aa89c  /tmp/region-talk.bundle' | sha256sum --check
          git bundle verify /tmp/region-talk.bundle
          git clone --branch main /tmp/region-talk.bundle /tmp/region-talk-bootstrap
          test "$(git -C /tmp/region-talk-bootstrap rev-parse HEAD)" = '6c8873572a4b4b76d9d51b66226335762b2d525a'

      - name: Install reviewed repository tree except workflow files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/region-talk-preserve/research
          cp SETUP.md /tmp/region-talk-preserve/SETUP.md
          cp CODE_AGENT_SETTINGS_PROMPT.md /tmp/region-talk-preserve/CODE_AGENT_SETTINGS_PROMPT.md
          cp research/REGION_TALK_RESEARCH_INTAKE_PROMPT_V3.md /tmp/region-talk-preserve/research/

          # The job token may commit ordinary repository files but GitHub blocks it
          # from creating other workflow files without the separate workflows scope.
          # ChatGPT installs those two reviewed workflow files directly afterwards.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/' \
            /tmp/region-talk-bootstrap/ "$GITHUB_WORKSPACE/"

          cp /tmp/region-talk-preserve/SETUP.md SETUP.md
          cp /tmp/region-talk-preserve/CODE_AGENT_SETTINGS_PROMPT.md CODE_AGENT_SETTINGS_PROMPT.md
          mkdir -p research
          cp /tmp/region-talk-preserve/research/REGION_TALK_RESEARCH_INTAKE_PROMPT_V3.md research/

          git config user.name 'region-talk-bootstrap'
          git config user.email 'region-talk-bootstrap@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Install autonomous Region Talk bootstrap'
          git push origin HEAD:main
