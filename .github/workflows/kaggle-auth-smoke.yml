name: Kaggle authentication smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-auth-smoke.yml'

permissions:
  contents: read

concurrency:
  group: region-talk-kaggle-auth-smoke
  cancel-in-progress: false

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Preflight credential presence
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_USERNAME:?missing KAGGLE_USERNAME variable}"
          : "${KAGGLE_KEY:?missing KAGGLE_KEY secret}"
          echo "::add-mask::${KAGGLE_KEY}"
          echo 'Kaggle legacy credential names are present.'

      - name: Install official Kaggle client
        shell: bash
        run: python -m pip install --disable-pip-version-check 'kaggle==1.8.4'

      - name: Authenticate through own-kernels listing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-auth-smoke

          set +e
          kaggle kernels list --mine --page-size 1 --csv \
            > /tmp/region-talk-kaggle-owned-kernels.csv \
            2> /tmp/region-talk-kaggle-auth-error.txt
          rc=$?
          set -e

          python - "$rc" <<'PY'
          import csv
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          rc = int(sys.argv[1])
          out = Path('artifacts/kaggle-auth-smoke/result.json')
          csv_path = Path('/tmp/region-talk-kaggle-owned-kernels.csv')
          error_path = Path('/tmp/region-talk-kaggle-auth-error.txt')

          result = {
              'schema_version': 'region-talk-kaggle-auth-smoke-v2',
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'auth_mode': 'legacy_username_key',
              'authenticated_endpoint': 'kernels_list_mine',
              'server_authenticated': rc == 0,
              'created_dataset': False,
              'started_kernel': False,
          }

          if rc == 0:
              rows = []
              if csv_path.is_file() and csv_path.stat().st_size:
                  with csv_path.open(newline='', encoding='utf-8', errors='replace') as fh:
                      rows = list(csv.DictReader(fh))
              result['owned_kernel_rows_observed'] = len(rows)
              print('Kaggle authentication succeeded; authenticated own-kernels endpoint reached.', flush=True)
          else:
              raw = error_path.read_text(encoding='utf-8', errors='replace') if error_path.is_file() else ''
              lowered = raw.casefold()
              if '401' in lowered or 'unauthorized' in lowered or 'authentication' in lowered:
                  failure = 'unauthorized'
              elif '403' in lowered or 'forbidden' in lowered:
                  failure = 'forbidden'
              elif '429' in lowered or 'too many requests' in lowered:
                  failure = 'rate_limited'
              else:
                  failure = 'kaggle_cli_nonzero'
              result['failure_class'] = failure
              result['client_exit_code'] = rc
              print(f'Kaggle authentication failed: {failure}', flush=True)

          out.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          raise SystemExit(0 if rc == 0 else 1)
          PY

          rm -f /tmp/region-talk-kaggle-owned-kernels.csv /tmp/region-talk-kaggle-auth-error.txt

      - name: Upload sanitized smoke receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: region-talk-kaggle-auth-smoke-${{ github.sha }}
          path: artifacts/kaggle-auth-smoke/result.json
          if-no-files-found: error
          retention-days: 30
