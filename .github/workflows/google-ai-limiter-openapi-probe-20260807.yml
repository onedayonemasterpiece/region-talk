name: Google AI limiter OpenAPI probe 20260807

on:
  push:
    branches:
      - agent/google-ai-limiter-diagnose-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: region-talk-control
    env:
      GOOGLE_AI_LIMITER_SUPABASE_URL: ${{ secrets.GOOGLE_AI_LIMITER_SUPABASE_URL }}
      GOOGLE_AI_LIMITER_SUPABASE_SERVICE_KEY: ${{ secrets.GOOGLE_AI_LIMITER_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exposed RPC names without executing them
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_AI_LIMITER_SUPABASE_URL:?missing limiter URL}"
          : "${GOOGLE_AI_LIMITER_SUPABASE_SERVICE_KEY:?missing limiter service key}"
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from urllib.request import Request, urlopen

          base = os.environ['GOOGLE_AI_LIMITER_SUPABASE_URL'].rstrip('/')
          key = os.environ['GOOGLE_AI_LIMITER_SUPABASE_SERVICE_KEY']
          req = Request(
              f'{base}/rest/v1/',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Accept': 'application/openapi+json',
                  'Accept-Profile': 'public',
              },
          )
          with urlopen(req, timeout=30) as response:
              spec = json.loads(response.read().decode('utf-8'))
          paths = dict(spec.get('paths') or {})
          rpc_names = sorted(path.removeprefix('/rpc/') for path in paths if path.startswith('/rpc/'))
          needles = ('sql', 'query', 'exec', 'migration', 'migrate', 'ddl', 'admin', 'database', 'statement')
          candidates = [name for name in rpc_names if any(token in name.lower() for token in needles)]
          print(f'rpc_count={len(rpc_names)}')
          print('administrative_rpc_candidates=' + json.dumps(candidates, ensure_ascii=False))
          for name in candidates:
              item = paths.get('/rpc/' + name) or {}
              operation = item.get('post') or item.get('get') or {}
              params = []
              for param in operation.get('parameters') or []:
                  if isinstance(param, dict):
                      params.append({
                          'name': param.get('name'),
                          'in': param.get('in'),
                          'required': param.get('required'),
                          'type': (param.get('schema') or {}).get('type'),
                      })
              print(json.dumps({'rpc': name, 'parameters': params}, ensure_ascii=False, sort_keys=True))
          print('google_ai_rpcs=' + json.dumps([n for n in rpc_names if n.startswith('google_ai_')], ensure_ascii=False))
          PY
