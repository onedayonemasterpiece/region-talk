name: Locate Google AI limiter direct DSN 20260807

on:
  push:
    branches:
      - agent/google-ai-limiter-diagnose-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SECRET_DSN: ${{ secrets.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
      VARIABLE_DSN: ${{ vars.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          [ -n "${SECRET_DSN:-}" ] && echo 'repo_secret=true' || echo 'repo_secret=false'
          [ -n "${VARIABLE_DSN:-}" ] && echo 'repo_variable=true' || echo 'repo_variable=false'

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: region-talk-control
    env:
      SECRET_DSN: ${{ secrets.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
      VARIABLE_DSN: ${{ vars.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          [ -n "${SECRET_DSN:-}" ] && echo 'control_secret=true' || echo 'control_secret=false'
          [ -n "${VARIABLE_DSN:-}" ] && echo 'control_variable=true' || echo 'control_variable=false'

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: region-talk-migration
    env:
      SECRET_DSN: ${{ secrets.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
      VARIABLE_DSN: ${{ vars.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          [ -n "${SECRET_DSN:-}" ] && echo 'migration_secret=true' || echo 'migration_secret=false'
          [ -n "${VARIABLE_DSN:-}" ] && echo 'migration_variable=true' || echo 'migration_variable=false'

  production-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: region-talk-production-publish
    env:
      SECRET_DSN: ${{ secrets.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
      VARIABLE_DSN: ${{ vars.REGION_TALK_SUPABASE_DIRECT_CONNECTION_STRING }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          [ -n "${SECRET_DSN:-}" ] && echo 'production_publish_secret=true' || echo 'production_publish_secret=false'
          [ -n "${VARIABLE_DSN:-}" ] && echo 'production_publish_variable=true' || echo 'production_publish_variable=false'
