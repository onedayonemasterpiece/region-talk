name: Validate Region Talk bootstrap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Unit tests
        run: python -m pytest
      - name: Repository contracts
        run: python scripts/validate_repository.py
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Reject tracked secret-shaped files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|kaggle\.json)$|\.(pem|key|session|token|sqlite|db)$'; then
            echo 'Tracked secret/state-shaped file detected' >&2
            exit 1
          fi
