name: Vendor exact working Region Talk runtime

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VENDOR_WORKING_REGION_TALK_RUNTIME
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vendor-working-region-talk-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    if: ${{ inputs.confirm == 'VENDOR_WORKING_REGION_TALK_RUNTIME' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out destination ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact working source
        uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: 5bbdb681623d5e4e0bff2133e487a6663c1a838a
          path: legacy-src
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize dependency-closed runtime without rewriting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/vendor_legacy_runtime.py \
            --source-dir legacy-src \
            --destination legacy_runtime \
            --manifest config/legacy-runtime-import-manifest.json

      - name: Verify isolated source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q legacy_runtime
          python legacy_runtime/scripts/region_talk_orchestrator.py --help >/dev/null
          python -m pip install --disable-pip-version-check \
            'aiosqlite>=0.21.0' 'sqlalchemy>=2.0,<3'
          set +e
          python legacy_runtime/scripts/region_talk_scheduled_runner.py --preflight-only \
            > /tmp/region-talk-vendored-preflight.json
          rc=$?
          set -e
          # Missing deployment settings are expected in this source-only job;
          # import/module errors are not. The production preflight always emits JSON.
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/region-talk-vendored-preflight.json').read_text(encoding='utf-8'))
          assert isinstance(payload.get('missing'), list)
          assert payload.get('ok') in {True, False}
          PY
          test "$rc" = '0' || test "$rc" = '2'

      - name: Commit exact runtime and manifest
        shell: bash
        run: |
          set -euo pipefail
          git add legacy_runtime config/legacy-runtime-import-manifest.json
          if git diff --cached --quiet; then
            echo 'Vendored runtime already matches the pinned source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor exact working Region Talk YDB runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish import summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f config/legacy-runtime-import-manifest.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          payload = json.loads(Path('config/legacy-runtime-import-manifest.json').read_text(encoding='utf-8'))
          print('### Working Region Talk runtime import')
          print()
          print(f"- source commit: `{payload['source_commit']}`")
          print(f"- files: `{payload['file_count']}`")
          print(f"- bytes: `{payload['total_bytes']}`")
          print('- source transformations: `none`')
          PY
          fi
